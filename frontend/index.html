<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculadora T-Student</title>
  </head>
  <body>
    <h1>Calculadora de T-Student</h1>
    <p><h2>
      Por favor, llene el formulario acontinuacion para poder calcular el
      ejercicio de T-student
    </h2></p>

    <div>


        <label for="cant_x">Ingrese el numero de variables X que quiere evaluar:</label>
        <input type="number" id="cant_x">
        <br>
        <br>

    </div>
    <div>

        <div id="div1">
        </div>

        <input type="checkbox" id="xmedia" value="xmedia">
        <label for="">Deseo agregar X media</label>

        
        <br><br>
        <label for="u">Ingrese el valor de la hipotesis (u):</label>
        <input type="number" id="u_hipotesis">
        <br>
        <br>

        <label for="confianza">Ingrese el valor de confianza:</label>
        <input type="number" id="confianza">

        <label for="significancia">Ingrese el valor de significancia:</label>
        <input type="number" id="significancia">
        <br>
        <br>
        
        <button id="btn_calcular">Calcular</button>

        

    </div>

    <script src="js/index.js"></script>
  </body>
</html>
