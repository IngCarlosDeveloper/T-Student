<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculadora T-Student</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <h1>Calculadora de T-Student</h1>
    <p><h2>
      Por favor, llene el formulario acontinuacion para poder calcular el
      ejercicio de T-student
    </h2></p>

    <!-- el form permite que el navegador revise los campos required al presionar Calcular -->
    <form id="formulario">

    <div id="div_cant_x">


        <label for="cant_x">Ingrese el numero de variables X que quiere evaluar:</label>
        <input type="number" id="cant_x" min="2" required>
        <br>
        <br>

    </div>
    <div>

        <div id="div1">
        </div>

        
        <br><br>
        <label for="u_hipotesis">Ingrese el valor de la hipotesis (u):</label>
        <input type="number" id="u_hipotesis" step="any" required>
        <br>
        <br>

        <label for="confianza">Ingrese el valor de confianza (%):</label>
        <input type="number" id="confianza" step="any" min="0" max="100" placeholder="Ej: 95" required>

        <label for="significancia">Ingrese el valor de significancia (%):</label>
        <input type="number" id="significancia" step="any" min="0" max="100" placeholder="Ej: 5" required>
        <br>
        <br>

        <label for="cola">Seleccione el tipo de tabla:</label>
        <select name="cola" id="cola">
          <option value="0">1 Cola</option>
          <option value="1">2 Colas</option>
        </select>
        <br><br>
        
        <button type="submit" id="btn_calcular">Calcular</button>

        

    </div>

    </form>

    <!-- aqui se muestran los resultados que devuelve python -->
    <div id="resultado"></div>

    <script src="js/index.js"></script>
  </body>
</html>
